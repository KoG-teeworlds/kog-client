name: KoG checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/kog/test_release_chain.sh
      - run: bash scripts/kog/check_brand.sh
      - run: bash scripts/kog/test_native_changes.sh

  hosted-runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only GitHub-hosted runners
        run: |
          if grep -rnE 'self-hosted' .github/workflows --include='*.yml' | grep -v 'hosted-runners:' | grep -v "grep -rnE"; then
            echo "workflows must use GitHub-hosted runners" >&2
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="-n 100 $SHA"
          if [ -n "${BASE//0/}" ]; then range="$BASE..$SHA"; fi
          docker run --rm -v "$PWD":/repo:ro \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose --log-opts="$range"

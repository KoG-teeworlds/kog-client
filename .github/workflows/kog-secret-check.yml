name: KoG secret check

on:
  workflow_dispatch:

permissions: {}

jobs:
  direct:
    runs-on: ubuntu-latest
    environment: canary-signing
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - run: |
          echo "direct: SIGNING_KEY ${#SIGNING_KEY} characters"
          python3 -c 'import json,os; print("direct: secrets seen:", sorted(json.loads(os.environ["SECRETS_JSON"])))'
  probe:
    uses: ./.github/workflows/kog-secret-probe.yml
    with:
      channel: canary

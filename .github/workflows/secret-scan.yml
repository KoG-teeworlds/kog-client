# Calls the organisation-wide scanner. False positives can be documented in
# .gitleaksignore at the repository root.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    uses: KoG-teeworlds/infra-github/.github/workflows/gitleaks.yml@main

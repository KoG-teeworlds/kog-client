name: KoG build

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.rule.outputs.native }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    # On a pull request HEAD is the merge commit, so its first parent is the base: the diff is what the pull request changes
    - name: Does the change reach the native build
      id: rule
      run: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          git diff --name-only HEAD^1 HEAD | bash scripts/kog/native_changes.sh >> "$GITHUB_OUTPUT"
        else
          echo native=true >> "$GITHUB_OUTPUT"
        fi

  build:
    name: Build (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    # Homebrew preparation on the hosted Intel runner can consume more than an
    # hour; leave enough time for both debug and release builds to finish.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_HTTP_MULTIPLEXING: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-22.04
          cmake-args: -G Ninja -DPREFER_BUNDLED_LIBS=ON
          # The bundled zlib declares read and write differently from glibc; with LTO under -Werror that is a link error
          cmake-args-release: -DIPO=ON -DCMAKE_EXE_LINKER_FLAGS=-Wno-error=lto-type-mismatch
          cmake-init-env: CXXFLAGS=-Werror
          package-file: "*-linux_x86_64.tar.xz"
          run: "yes"
        # A pull request that cannot change the native build (docs, spelling, scripts) gets this leg on a cheap Linux runner
        # that does nothing: the check keeps its name and passes, and the scarce macOS runners are left alone.
        # This is a compile and test check only, so it runs on the Intel pool for pull requests and main alike; the Apple Silicon
        # download is built by the package workflow at release time
        - name: macos
          run: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true') && 'yes' || 'no' }}
          os: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true') && 'macos-15-intel' || 'ubuntu-22.04' }}
          cmake-args: -G Ninja -DPREFER_BUNDLED_LIBS=ON
          cmake-args-release: -DIPO=ON
          package-file: "*-macos.dmg"
        - name: windows
          os: windows-latest
          cmake-args: -A x64 -DEXCEPTION_HANDLING=ON
          package-file: "*-win64.zip"
          run: "yes"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: matrix.run == 'yes'
      with:
        submodules: recursive
        persist-credentials: false

    - name: Prepare Linux
      if: matrix.run == 'yes' && (runner.os == 'Linux')
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake glslang-tools libcurl4-openssl-dev libfreetype6-dev libglew-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libpng-dev libsdl2-dev libsqlite3-dev libssl-dev libvulkan-dev libwavpack-dev ninja-build pkg-config spirv-tools zlib1g-dev xvfb xauth libgl1-mesa-dri libglx-mesa0

    - name: Prepare macOS
      if: matrix.run == 'yes' && (runner.os == 'macOS')
      run: |
        brew update
        brew install ninja pkg-config
        pip3 install --break-system-packages dmgbuild==1.6.7 pyobjc-framework-Quartz==12.2.2
        echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> "$GITHUB_PATH"
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Toolchain versions
      if: matrix.run == 'yes'
      shell: bash
      run: |
        cmake --version | head -1
        if command -v ninja >/dev/null; then ninja --version; fi
        if command -v c++ >/dev/null; then c++ --version | head -1; fi
        rustc --version
        echo "KOG_EXE=$(sed -n 's/^#define KOG_CLIENT_EXECUTABLE "\(.*\)"$/\1/p' src/game/kog_version.h)" >> "$GITHUB_ENV"
        # CMake 4.5 turns include_directories() in the downloaded googletest into an error under -Werror=dev; older CMake rejects the category
        echo "message(STATUS ok)" > "$RUNNER_TEMP/probe.cmake"
        if cmake -Wno-error=non-target-directive -P "$RUNNER_TEMP/probe.cmake" >/dev/null 2>&1; then
          echo "CMAKE_EXTRA=-Wno-error=non-target-directive" >> "$GITHUB_ENV"
        fi

    - name: Cache Rust dependencies
      if: matrix.run == 'yes'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-

    - name: Build in debug mode
      if: matrix.run == 'yes'
      shell: bash
      run: |
        mkdir debug
        cd debug
        cmake --version
        cmake -E env ${{ matrix.cmake-init-env }} cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Debug -Werror=dev ${CMAKE_EXTRA:+"$CMAKE_EXTRA"} -DCLIENT=ON -DSERVER=OFF -DTOOLS=OFF -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        cmake --build . --config Debug --target game-client

    - name: Test debug
      if: matrix.run == 'yes'
      run: |
        cd debug
        cmake --build . --config Debug --target run_tests

    - name: Build in release mode
      if: matrix.run == 'yes'
      shell: bash
      run: |
        mkdir release
        cd release
        cmake -E env ${{ matrix.cmake-init-env }} cmake ${{ matrix.cmake-args }} ${{ matrix.cmake-args-release }} -DCMAKE_BUILD_TYPE=Release -Werror=dev ${CMAKE_EXTRA:+"$CMAKE_EXTRA"} -DCLIENT=ON -DSERVER=OFF -DTOOLS=OFF -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target game-client

    - name: Test release
      if: matrix.run == 'yes'
      run: |
        cd release
        cmake --build . --config Release --target run_tests

    # The Windows and macOS runners have no GPU, so only Linux starts the client
    - name: Smoke test
      if: matrix.run == 'yes' && (runner.os == 'Linux')
      run: bash scripts/kog/smoke_test.sh release "$KOG_EXE" 25

    - name: Upload smoke test logs
      if: matrix.run == 'yes' && (runner.os == 'Linux' && always())
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kog-smoke-logs
        path: release/smoke-results
        if-no-files-found: ignore
        retention-days: 14

    - name: Package
      if: matrix.run == 'yes'
      run: |
        cd release
        cmake --build . --config Release --target package_default
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Upload build
      if: matrix.run == 'yes'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kog-${{ matrix.name }}
        path: release/artifacts
        retention-days: 14

name: KoG secret probe

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}-signing
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - run: |
          echo "reusable: SIGNING_KEY ${#SIGNING_KEY} characters"
          python3 -c 'import json,os; print("reusable: secrets seen:", sorted(json.loads(os.environ["SECRETS_JSON"])))'

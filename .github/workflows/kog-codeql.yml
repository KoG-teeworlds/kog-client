name: KoG CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    env:
      CARGO_HTTP_MULTIPLEXING: false
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, python]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Prepare Linux
      if: matrix.language == 'cpp'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake glslang-tools libavcodec-dev libavformat-dev libavutil-dev libfreetype6-dev libglew-dev libmariadb-dev libnotify-dev libsdl2-dev libsqlite3-dev libswresample-dev libswscale-dev libvulkan-dev libwebsockets-dev libx264-dev ninja-build pkg-config spirv-tools

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ matrix.language }}
        trap-caching: false

    - name: Cache Rust dependencies
      if: matrix.language == 'cpp'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-codeql-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-codeql-

    - name: Build
      if: matrix.language == 'cpp'
      run: |
        mkdir release
        cd release
        cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DANTIBOT=ON -DMYSQL=ON -DWEBSOCKETS=ON ..
        cmake --build . --config RelWithDebInfo --target everything

    - name: Analyze
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

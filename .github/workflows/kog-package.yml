name: KoG package

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      build_number:
        type: string
        default: ""

permissions: {}

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
        - name: linux
          os: ubuntu-latest
          cmake-args: -G Ninja -DIPO=ON
          package-file: "*-linux_x86_64.tar.xz"
        # Libraries come from ddnet-libs, so the app has no path into Homebrew; SDL2 and FFmpeg are copied into Contents/Frameworks
        - name: macos
          os: macos-15
          cmake-args: -G Ninja -DIPO=ON -DPREFER_BUNDLED_LIBS=ON
          package-file: "*-macos.dmg"
        - name: windows
          os: windows-latest
          cmake-args: -A x64 -DEXCEPTION_HANDLING=ON
          package-file: "*-win64.zip"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Prepare Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake glslang-tools libavcodec-dev libavformat-dev libavutil-dev libcurl4-openssl-dev libfreetype6-dev libglew-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libpng-dev libsdl2-dev libsqlite3-dev libssl-dev libswresample-dev libswscale-dev libvulkan-dev libwavpack-dev libx264-dev ninja-build pkg-config spirv-tools zlib1g-dev xvfb xauth libgl1-mesa-dri libglx-mesa0

    - name: Prepare macOS
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install ninja pkg-config
        pip3 install --break-system-packages dmgbuild==1.6.7 pyobjc-framework-Quartz==12.2.2
        echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> "$GITHUB_PATH"
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Toolchain probe
      shell: bash
      run: |
        # CMake 4.5 turns include_directories() in a downloaded dependency into an error under -Werror=dev; older CMake rejects the category
        echo "message(STATUS ok)" > "$RUNNER_TEMP/probe.cmake"
        if cmake -Wno-error=non-target-directive -P "$RUNNER_TEMP/probe.cmake" >/dev/null 2>&1; then
          echo "CMAKE_EXTRA=-Wno-error=non-target-directive" >> "$GITHUB_ENV"
        fi

    - name: Build the client
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        BUILD_NUMBER: ${{ inputs.build_number }}
      run: |
        mkdir release
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -Werror=dev ${{ env.CMAKE_EXTRA }} -DSERVER=OFF -DTOOLS=OFF -DAUTOUPDATE=ON \
          -DKOG_CHANNEL="$CHANNEL" -DKOG_BUILD_NUMBER="$BUILD_NUMBER" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target package_default

    - name: Check that no server was built
      shell: bash
      run: |
        cd release
        if find . -iname 'DDNet-Server*' | grep -q .; then echo "a server was built" >&2; exit 1; fi
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    # The packaged client is started before it is attested; the Windows and macOS runners have no GPU
    - name: Smoke test the package
      if: runner.os == 'Linux'
      run: |
        exe=$(sed -n 's/^#define KOG_CLIENT_EXECUTABLE "\(.*\)"$/\1/p' src/game/kog_version.h)
        mkdir release/smoke
        tar -xf release/artifacts/*-linux_x86_64.tar.xz -C release/smoke --strip-components=1
        bash scripts/kog/smoke_test.sh release/smoke "$exe" 25

    - name: Upload smoke test logs
      if: runner.os == 'Linux' && always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kog-package-smoke-logs
        path: release/smoke/smoke-results
        if-no-files-found: ignore
        retention-days: 7

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kog-package-${{ matrix.name }}
        path: release/artifacts
        if-no-files-found: error
        retention-days: 7

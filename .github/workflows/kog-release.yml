name: KoG release

on:
  workflow_dispatch:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH, equal to KOG_CLIENT_VERSION
        required: true
      run_id:
        description: Run ID of the KoG build run for the commit to release
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kog-*
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Assemble
        run: bash scripts/kog/assemble_release.sh "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the prerelease
        run: |
          gh release create "v$VERSION" release/* --prerelease --title "KoG Client $VERSION" \
            --notes "Not usable for updates until the release is signed in kog-client-updates."

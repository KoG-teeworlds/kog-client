name: KoG release

on:
  workflow_dispatch:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH, equal to KOG_CLIENT_VERSION
        required: true
      rollout_percent:
        description: Percent of installs that get the update (0-100)
        default: "100"
      min_version:
        description: Oldest version that may still run, empty for none (older ones are told to update)
        default: ""
      notes_url:
        description: Release notes page on client.kog.tw or github.com/KoG-teeworlds
        default: ""
      changes:
        description: Up to 3 short changes, separated by |
        default: ""

permissions: {}

jobs:
  guard:
    name: Only a checked head of main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the source
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version" >&2; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "releases are made from main only" >&2; exit 1; }
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the commit is not on main" >&2; exit 1; }
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo "the commit is not the head of main any more" >&2; exit 1; }
          grep -q "#define KOG_CLIENT_VERSION \"$VERSION\"" src/game/kog_version.h || { echo "KOG_CLIENT_VERSION is not $VERSION" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate --jq '.check_runs[] | "\(.name)\t\(.conclusion)"' > checks.txt
          for name in "Build (linux)" "Build (macos)" "Build (windows)" "Analyze (cpp)" "Analyze (python)" "Spelling" "release-chain" "gitleaks"; do
            grep -qxF "$name"$'\tsuccess' checks.txt || { echo "the check '$name' has not passed on this commit" >&2; exit 1; }
          done

  package:
    needs: guard
    uses: ./.github/workflows/kog-package.yml
    with:
      channel: stable
    permissions:
      contents: read

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
      MIN_VERSION: ${{ inputs.min_version }}
      NOTES_URL: ${{ inputs.notes_url }}
      CHANGES_INPUT: ${{ inputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kog-package-*
          path: artifacts
      - name: Assemble
        run: |
          export CHANGES=${CHANGES_INPUT//|/$'\n'}
          bash scripts/kog/assemble_release.sh stable "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the prerelease
        run: |
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --prerelease --title "KoG Client $VERSION" \
            --notes "Not usable for updates until it is signed twice: workflow Sign release in kog-client-updates, then scripts/kog/approve_release.sh."

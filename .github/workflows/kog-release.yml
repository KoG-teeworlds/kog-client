name: KoG release

on:
  workflow_dispatch:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH, equal to KOG_CLIENT_VERSION
        required: true
      run_id:
        description: Run ID of the KoG build run for the commit to release
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kog-*
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Assemble
        run: bash scripts/kog/assemble_release.sh "$VERSION"
      - name: Install runtime libraries and Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake glslang-tools libavcodec-dev libavformat-dev libavutil-dev libcurl4-openssl-dev libfreetype6-dev libglew-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libpng-dev libsdl2-dev libsqlite3-dev libssl-dev libswresample-dev libswscale-dev libvulkan-dev libwavpack-dev libx264-dev ninja-build pkg-config spirv-tools zlib1g-dev xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Smoke test the packaged client
        run: bash scripts/kog/smoke_test.sh work/linux "$(sed -n 's/^#define KOG_CLIENT_EXECUTABLE "\(.*\)"$/\1/p' src/game/kog_version.h)" 25
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the prerelease
        run: |
          gh release create "v$VERSION" release/* --prerelease --title "KoG Client $VERSION" \
            --notes "Not usable for updates until the release is signed in kog-client-updates."
